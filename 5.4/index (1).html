<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Graphical Art</title>
<style>
body {
  margin: 0;
  padding: 30px 20px;
  background: #faf6f3;
  font-family: Georgia, "Times New Roman", serif;
  color: #3b2f2b;
}
h1 {
  text-align: center;
  margin: 0 0 30px;
}
.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
}
figure {
  margin: 0;
  text-align: center;
}
svg {
  display: block;
  background: #ffffff;
  border: 6px solid #ef9a8f;
  box-sizing: content-box;
}
figcaption {
  margin-top: 12px;
  font-weight: bold;
  font-size: 17px;
}
</style>
</head>
<body>

<div class="gallery">
